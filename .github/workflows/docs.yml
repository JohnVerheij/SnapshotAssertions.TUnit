name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-docs.yml@b44b1c109c96ee8d30ae6d56244d579986685516 # v1.9.0
    with:
      package: SnapshotAssertions
    permissions:
      contents: read    # checkout and build
      pages: write      # publish the site to GitHub Pages
      id-token: write   # the Pages deployment authenticates with an OIDC token
