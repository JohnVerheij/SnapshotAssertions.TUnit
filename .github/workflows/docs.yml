name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-docs.yml@6ef32b70824ee05975fb4fdae59d02acbed4f4cb # v1.6.0
    with:
      package: SnapshotAssertions
    permissions:
      contents: read    # checkout and build
      pages: write      # publish the site to GitHub Pages
      id-token: write   # the Pages deployment authenticates with an OIDC token
