name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-docs.yml@e11f599294bf72e9492a8bb9f04e99475770dd50 # v1.4.0
    with:
      package: SnapshotAssertions
    permissions:
      contents: read    # checkout and build
      pages: write      # publish the site to GitHub Pages
      id-token: write   # the Pages deployment authenticates with an OIDC token
