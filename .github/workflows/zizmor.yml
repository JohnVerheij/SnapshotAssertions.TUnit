name: zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-zizmor.yml@b44b1c109c96ee8d30ae6d56244d579986685516 # v1.9.0
    permissions:
      contents: read   # checkout only
      actions: read    # zizmor reads workflow metadata of the repository
