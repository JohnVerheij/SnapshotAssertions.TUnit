name: zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-zizmor.yml@7722848a0484cbf98ff0b2affb9a3b12c783dce7 # v1.5.0
    permissions:
      contents: read   # checkout only
      actions: read    # zizmor reads workflow metadata of the repository
