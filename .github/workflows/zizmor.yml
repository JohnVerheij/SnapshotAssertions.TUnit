name: zizmor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/zizmor.yml'

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-zizmor.yml@e11f599294bf72e9492a8bb9f04e99475770dd50 # v1.4.0
    permissions:
      contents: read   # checkout only
      actions: read    # zizmor reads workflow metadata of the repository
