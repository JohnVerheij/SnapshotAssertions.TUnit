name: Scorecard supply-chain security

on:
  # Re-score when branch protection changes (a Scorecard input), weekly, and on push to main.
  branch_protection_rule:
  schedule:
    - cron: '37 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read           # checkout + repository analysis (job-level perms override workflow-level)
      security-events: write   # upload SARIF results to GitHub code scanning
      id-token: write          # publish results to the public OpenSSF Scorecard API
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score to the public Scorecard API so the README badge resolves;
          # also feeds the OpenSSF transparency dataset. Safe for a public repository.
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
          category: scorecard
