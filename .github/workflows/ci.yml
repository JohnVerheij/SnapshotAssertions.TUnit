name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref to avoid wasting minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Shared family CI: build, tests with coverage, license gate, pack, smoke test against the packed
    # package, Native AOT gate. See https://github.com/JohnVerheij/assertions-ci for the inputs and the
    # repository contract.
    uses: JohnVerheij/assertions-ci/.github/workflows/package-ci.yml@916d3ca1d50016135cdd67ae7688fb173818f3f2 # v1.0.0
    with:
      package: SnapshotAssertions
      expected-package-files: build/SnapshotAssertions.TUnit.targets
    permissions:
      contents: read
      id-token: write   # Codecov upload through OIDC
