name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref to avoid wasting minutes on superseded commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Shared family CI: build, tests with coverage, license gate, pack, smoke test against the packed
    # package, Native AOT gate. See https://github.com/JohnVerheij/assertions-ci for the inputs and the
    # repository contract.
    uses: JohnVerheij/assertions-ci/.github/workflows/package-ci.yml@ec8bf01b46c95c163d7e99f5f21bf46c76a6ed79 # v1.2.1
    with:
      package: SnapshotAssertions
      expected-package-files: build/SnapshotAssertions.TUnit.targets
    permissions:
      contents: read
      id-token: write   # Codecov upload through OIDC

  dependency-graph:
    # Submits the resolved NuGet dependencies (exact versions, transitive included) to GitHub's dependency
    # graph, so Dependabot alerts see the real versions. Pushes to main only.
    if: github.event_name == 'push'
    uses: JohnVerheij/assertions-ci/.github/workflows/dependency-graph.yml@ec8bf01b46c95c163d7e99f5f21bf46c76a6ed79 # v1.2.1
    permissions:
      contents: write   # dependency submission API; the detect job itself only reads
