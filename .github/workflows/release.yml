name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:   # dry-run: the build job only, nothing is published

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-progress release

jobs:
  build:
    # Shared family release build: every CI gate on the exact packages that ship, plus the version gate,
    # release notes, SBOM, VEX and SHA256SUMS. It can only read the repository, so build and test code never
    # runs next to a publishing credential. See https://github.com/JohnVerheij/assertions-ci.
    uses: JohnVerheij/assertions-ci/.github/workflows/package-ci.yml@87b99f445469020818c41f18e187c5e69510c973 # v1.1.0
    with:
      package: SnapshotAssertions
      expected-package-files: build/SnapshotAssertions.TUnit.targets
      release: true
    permissions:
      contents: read
      id-token: write   # ceiling for the Codecov job, which a release skips; the build job itself only reads

  publish:
    # Checks the tag and the release files, attests, pushes to NuGet through Trusted Publishing and creates
    # the GitHub release. Runs no project code.
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # GitHub release
      id-token: write       # NuGet Trusted Publishing and Sigstore signing
      attestations: write   # provenance and SBOM attestations
    environment:
      name: nuget
      url: https://www.nuget.org/packages/SnapshotAssertions/
    steps:
      - name: Publish
        uses: JohnVerheij/assertions-ci/.github/actions/package-publish@87b99f445469020818c41f18e187c5e69510c973 # v1.1.0
        with:
          package: SnapshotAssertions
          version: ${{ needs.build.outputs.version }}
          checksum: ${{ needs.build.outputs.checksum }}
