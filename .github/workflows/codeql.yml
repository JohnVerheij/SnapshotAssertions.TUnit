name: CodeQL

# No path filters: CodeQL analyzes every change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-codeql.yml@3e5a98b06b142934ddc0c9d089717788a32bd1b6 # v1.8.0
    permissions:
      contents: read           # checkout + build
      security-events: write   # upload CodeQL results to code scanning
      actions: read            # read workflow run metadata during analysis
