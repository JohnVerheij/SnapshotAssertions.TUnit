name: CodeQL

# No path filters: CodeQL analyzes every change.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    uses: JohnVerheij/assertions-ci/.github/workflows/package-codeql.yml@7722848a0484cbf98ff0b2affb9a3b12c783dce7 # v1.5.0
    permissions:
      contents: read           # checkout + build
      security-events: write   # upload CodeQL results to code scanning
      actions: read            # read workflow run metadata during analysis
